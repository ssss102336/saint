 <!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>시대별 삽화</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="page-header">

    <h1>시대별 삽화</h1>

    <p>
        생택쥐페리의 삶을 담은 이미지와 기록
    </p>

</header>



<!-- 시대 선택 버튼 -->

<div class="illustration-menu">

    <button onclick="showCategory('child')">
        유년기
    </button>

    <button onclick="showCategory('air')">
        항공 우편 비행사
    </button>

    <button onclick="showCategory('desert')">
        표류 / 사고 기록
    </button>

    <button onclick="showCategory('war')">
        전쟁 조종사
    </button>

</div>



<!-- 유년기 -->

<section class="category" id="child">

    <h2>유년기</h2>

    <div class="gallery">

        <div class="card" onclick="showDescription('유년기 시절의 생택쥐페리와 관련된 기록입니다.')">
            <div class="image-box">이미지 1</div>
        </div>

        <div class="card" onclick="showDescription('유년기의 기억과 경험을 담은 기록입니다.')">
            <div class="image-box">이미지 2</div>
        </div>

        <div class="card" onclick="showDescription('양베리의 비행장에서 처음 비행을 경험했던 시기의 기록입니다.')">
            <div class="image-box">이미지 3</div>
        </div>

        <div class="card" onclick="showDescription('소년 시절의 모습과 관련된 기록입니다.')">
            <div class="image-box">이미지 4</div>
        </div>

        <div class="card" onclick="showDescription('어린 시절의 환경과 성장에 관한 기록입니다.')">
            <div class="image-box">이미지 5</div>
        </div>

        <div class="card" onclick="showDescription('작가가 되기 전의 경험을 담은 기록입니다.')">
            <div class="image-box">이미지 6</div>
        </div>

    </div>

</section>



<!-- 항공 우편 비행사 -->

<section class="category" id="air">

    <h2>항공 우편 비행사</h2>

    <div class="gallery">

        <div class="card" onclick="showDescription('1926년 항공 우편 조종사로 활동을 시작했던 시기의 기록입니다.')">
            <div class="image-box">이미지 1</div>
        </div>

        <div class="card" onclick="showDescription('항공 우편 비행사로 활동하며 겪었던 경험을 담은 기록입니다.')">
            <div class="image-box">이미지 2</div>
        </div>

        <div class="card" onclick="showDescription('비행과 관련된 생택쥐페리의 모습을 담은 기록입니다.')">
            <div class="image-box">이미지 3</div>
        </div>

        <div class="card" onclick="showDescription('항공 우편 비행과 관련된 기록입니다.')">
            <div class="image-box">이미지 4</div>
        </div>

        <div class="card" onclick="showDescription('비행사로 활동했던 당시의 기록입니다.')">
            <div class="image-box">이미지 5</div>
        </div>

        <div class="card" onclick="showDescription('항공 우편 비행의 시대를 보여주는 기록입니다.')">
            <div class="image-box">이미지 6</div>
        </div>

        <div class="card" onclick="showDescription('항공 우편 비행사로서의 삶을 보여주는 기록입니다.')">
            <div class="image-box">이미지 7</div>
        </div>

    </div>

</section>



<!-- 표류 / 사고 기록 -->

<section class="category" id="desert">

    <h2>표류 / 사고 기록</h2>

    <div class="gallery">

        <div class="card" onclick="showDescription('1935년 파리-사이공 비행 중 리비아 사막에 추락한 사고 기록입니다.')">
            <div class="image-box">이미지 1</div>
        </div>

        <div class="card" onclick="showDescription('리비아 사막에서 겪었던 표류와 생존의 기록입니다.')">
            <div class="image-box">이미지 2</div>
        </div>

        <div class="card" onclick="showDescription('사막에서의 생존 과정과 관련된 기록입니다.')">
            <div class="image-box">이미지 3</div>
        </div>

        <div class="card" onclick="showDescription('사고 이후의 경험을 담은 기록입니다.')">
            <div class="image-box">이미지 4</div>
        </div>

        <div class="card" onclick="showDescription('표류와 사고의 경험이 남긴 기록입니다.')">
            <div class="image-box">이미지 5</div>
        </div>

    </div>

</section>



<!-- 전쟁 조종사 -->

<section class="category" id="war">

    <h2>전쟁 조종사</h2>

    <div class="gallery">

        <div class="card" onclick="showDescription('전쟁 조종사로 활동했던 시기의 기록입니다.')">
            <div class="image-box">이미지 1</div>
        </div>

        <div class="card" onclick="showDescription('아라스 상공 정찰 그룹에서 활동했던 시기의 기록입니다.')">
            <div class="image-box">이미지 2</div>
        </div>

        <div class="card" onclick="showDescription('전쟁 속에서 이어간 비행과 기록을 담은 자료입니다.')">
            <div class="image-box">이미지 3</div>
        </div>

        <div class="card" onclick="showDescription('1944년 마지막 비행과 관련된 기록입니다.')">
            <div class="image-box">이미지 4</div>
        </div>

    </div>

</section>



<!-- 설명창 -->

<div id="description" class="description"></div>



<a href="index.html" class="back-button">
    돌아가기
</a>



<script src="script.js"></script>

</body>

</html>
