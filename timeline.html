<h1 class="page-title">
전체 타임라인
</h1>



<div class="timeline">



<div class="event">

<span>1900</span>

<h2>유년기</h2>

<p>
생텍쥐페리는 프랑스 리옹에서 태어나 어린 시절을 보냈다.
가족과 성장 과정에서 형성된 상상력은
이후 그의 작품 세계에 영향을 주었다.
</p>

</div>



<div class="event">

<span>1920년대</span>

<h2>항공 우편 비행사</h2>

<p>
항공 우편 비행사로 활동하며
하늘과 사막, 인간과 자연에 대한 경험을 쌓았다.
</p>

</div>



<div class="event">

<span>1930년대</span>

<h2>표류 / 사고 기록</h2>

<p>
비행 사고와 조난 경험을 통해
극한 상황 속 인간의 모습을 기록했다.
</p>

</div>



<div class="event">

<span>1940년대</span>

<h2>전쟁 조종사</h2>

<p>
제2차 세계대전 중 정찰 비행 임무에 참여했고,
마지막 비행을 떠났다.
</p>

</div>



</div>
